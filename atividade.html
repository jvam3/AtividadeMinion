<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <link rel="stylesheet" href="CSS.css">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Minion Maneiro</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

 <nav class="navbar navbar-expand-lg bg-dark navbar-dark" data-bs-theme="dark">
 <div class="container-fluid">
 <a class="navbar-brand" href="#">Minha Marca</a>
 <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
 <span class="navbar-toggler-icon"></span>
 </button>
 <div class="collapse navbar-collapse" id="navbarSupportedContent">
 <ul class="navbar-nav me-auto mb-2 mb-lg-0">
 <li class="nav-item">
 <a class="nav-link active" aria-current="page" href="#">Home</a>
 </li>
 <li class="nav-item">
 <a class="nav-link" href="#">Serviços</a>
 </li>
 <li class="nav-item">
 <a class="nav-link disabled" aria-disabled="true">Contato</a>
 </li>
 </ul>
 <form class="d-flex" role="search">
 <input class="form-control me-2" type="search" placeholder="Pesquisar..." aria-label="Search"/>
 <button class="btn btn-outline-success" type="submit">Buscar</button>
 </form>
 </div>
 </div>
 </nav>
 <div id="carouselExampleDark" class="carousel carousel-dark slide">
 <div class="carousel-indicators">
 <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
 <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
 <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
 </div>
 <div class="carousel-inner">
 <div class="carousel-item active" data-bs-interval="10000">
 <img src="https://tse1.mm.bing.net/th/id/OIP.zqQONjKEaebG0t6lwy8uIQHaEo?pid=Api&P=0&h=180" class="d-block w-100 carousel-img" alt="Slide 1">   
 <div class="carousel-caption d-none d-md-block text-white">
 <h5>Primeiro Slide</h5>
 </div>
 </div>
 <div class="carousel-item" data-bs-interval="2000">
<img src="https://tse1.mm.bing.net/th/id/OIP.zqQONjKEaebG0t6lwy8uIQHaEo?pid=Api&P=0&h=180" class="d-block w-100 carousel-img" alt="Slide 2">
 <div class="carousel-caption d-none d-md-block text-white">
 <h5>Segundo Slide</h5>
 </div>
 </div>
 <div class="carousel-item">
<img src="https://tse1.mm.bing.net/th/id/OIP.zqQONjKEaebG0t6lwy8uIQHaEo?pid=Api&P=0&h=180" class="d-block w-100 carousel-img" alt="Slide 3">
 <div class="carousel-caption d-none d-md-block text-white">
 <h5>Terceiro Slide</h5>
 </div>
 </div>
 </div>
 <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
 <span class="carousel-control-prev-icon" aria-hidden="true"></span>
 <span class="visually-hidden">Anterior</span>
 </button>
 <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
 <span class="carousel-control-next-icon" aria-hidden="true"></span>
 <span class="visually-hidden">Próximo</span>
 </button>
 </div>
<footer>
 <div class="container">
 <p class="mb-0">Olá Charlito.</p>
 <small>Fica com esse minion maneiro.</small>
 </div>
 </footer>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
